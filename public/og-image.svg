    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B468"/>
      <stop offset="50%" stop-color="#C9A050"/>
      <stop offset="100%" stop-color="#99732B"/>
